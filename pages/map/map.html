<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map</title>
  <link rel="stylesheet" href="map_style.css" />
</head>

<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <img src="../../assets/images/landing_page/Logo.png" alt="Logo" />
      </div>
      <nav class="nav">
        <ul class="nav-links">
          <li><a href="#">About</a></li>
          <li><a href="#">Map</a></li>
          <li><a href="#">Zoos</a></li>
          <li><a href="#">Contact Us</a></li>
          <li><a href="#">Donate</a></li>

        <ul class="nav-social">
          <li>
            <a href="#">
              <img src="../../assets/images/landing_page/YouTube.png" alt="YouTube" />
            </a>
          </li>
          <li>
            <a href="#">
              <img src="../../assets/images/landing_page/Instagram.png" alt="Instagram" />

          </li>
          <li>
            <a href="#">
              <img src="../../assets/images/landing_page/Facebook.png" alt="Facebook" />
            </a>

        </ul>
      </nav>
    </div>

    <div class="container hero-content">
      <div class="hero-text">
        <h1 class="watch-favorite-animal">Watch Your Favorite Animal Online</h1>

        <button class="btn">

        <img src="../../assets/images/landing_page/zoo_logo_white.png" alt="Online Zoo" />

        <a href="#">MAP</a>

      </div>
      <div class="footer-social">

        <img src="../../assets/images/landing_page/Instagram.png" alt="Instagram" />
        <img src="../../assets/images/landing_page/Facebook.png" alt="Facebook" />
      </div>
    </div>
